---
# Codecov configuration.
#
# Validate after edits with:
#     curl --data-binary @.codecov.yml https://codecov.io/validate
#
# Reference: https://docs.codecov.com/docs/codecov-yaml

codecov:
  notify:
    # Hold every status and comment until ci.yml's `codecov-notify` job,
    # which runs after all test jobs, says the uploads are in. Without this,
    # statuses are computed from the first uploads and can stay stale.
    manual_trigger: true

coverage:
  # The headline number Codecov reports, rounded to one decimal place so the
  # GitHub status text isn't 91.234567%.
  precision: 1
  round: down
  range: "80...100"

  status:
    project:
      default:
        # `auto` pins the bar to the base commit's coverage: any drop in
        # overall project coverage on a PR fails the status. The bar ratchets
        # up implicitly, since a PR that raises coverage raises the floor.
        target: auto
        # No wobble: with `auto`, a 1% drop is meaningful and should be visible.
        threshold: 0%
        if_not_found: success
        if_ci_failed: error

    patch:
      default:
        # Lines touched by the PR must themselves hit 99%: new code is held to
        # a much higher bar than the project so `project: auto` moves upward.
        target: 99%
        threshold: 0%
        if_not_found: success
        if_ci_failed: error

# Per-component ratcheting. Each component gets an independent `auto` project
# status, so the privacy boundary can't hide behind gains elsewhere.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 0%
  individual_components:
    - component_id: privacy
      name: "privacy"
      paths:
        - "src/privacy/**"
        - "src/hook/**"
    - component_id: state
      name: "state"
      paths:
        - "src/store.rs"
        - "src/crew.rs"
        - "src/project.rs"
        - "src/card.rs"
        - "src/modverb.rs"
    - component_id: cli
      name: "cli"
      paths:
        - "src/cli/**"
        - "src/launch/**"
        - "src/settings.rs"
        - "src/herdr.rs"
        - "src/agents.rs"
        - "src/config.rs"
    - component_id: mod
      name: "mod"
      paths:
        - "plugin/hooks/core/**"
    - component_id: tools
      name: "tools"
      paths:
        - "tools/**"

# Files we never measure. Listing them keeps the displayed coverage focused on
# production code.
ignore:
  # Tests count for what they exercise, not their own line hits.
  - "tests"
  - "target"
  - "node_modules"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  # `claude plugin test` covers these without producing a coverage report.
  - "plugin/hooks/register.ts"
  - "plugin/hooks/adapter.ts"
  - "**/__pycache__"

# Post a Codecov summary comment on every PR and update it in place.
comment:
  layout: "reach,diff,flags,components,files"
  behavior: default
  # Post even when there's no coverage delta: one permanent surface for the numbers.
  require_changes: false
  # One Rust report per OS (2), the mod and the tools.
  after_n_builds: 4
