name: Apply Release Patch
description: Apply the release commit prepared by the release workflow

inputs:
  release-patch-name:
    required: true
    description: 'Release patch to apply'
  allowed-files:
    required: false
    default: |
      Cargo.toml
      Cargo.lock
      plugin/.claude-plugin/plugin.json
      CHANGELOG.md
    description: 'Files the patch may change, one per line. The patch is refused when it touches any other.'
  verify-base:
    required: false
    default: 'true'
    description: 'Require the patch to sit directly on the dispatched commit. The patch applied after the release commit sets it to false.'


runs:
  using: composite

  steps:

    - name: Download Release Patch Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.release-patch-name }}

    - name: Apply The Release Patch
      id: apply
      shell: bash
      env:
        RELEASE_PATCH_NAME: ${{ inputs.release-patch-name }}
        ALLOWED_FILES: ${{ inputs.allowed-files }}
        VERIFY_BASE: ${{ inputs.verify-base }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        git am --no-verify --committer-date-is-author-date "$RELEASE_PATCH_NAME"
        # No `mapfile`: macOS runners' /bin/bash is 3.2.
        allowed=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then allowed+=("$line"); fi
        done <<<"$ALLOWED_FILES"
        "$ACTION_PATH/check-files.sh" commit ${allowed[@]+"${allowed[@]}"}
        # Safety net: actions/checkout lands on GITHUB_SHA, where the patch was built; this fails if a
        # future checkout change (e.g. `ref: main`) would tag a tree the release never built.
        if [ "$VERIFY_BASE" = "true" ]; then
          base="$(git rev-parse HEAD^)"
          if [[ "$base" != "$GITHUB_SHA" ]]; then
            echo "::error::The release patch was applied on ${base}, not on the dispatched commit ${GITHUB_SHA}" >&2
            exit 1
          fi
        fi
