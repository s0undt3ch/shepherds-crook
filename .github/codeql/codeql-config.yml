name: crook CodeQL config

# Test assertion messages print session ids, which rust/cleartext-logging reads
# as secrets. Test code lives in predictable files (CONTRIBUTING.md), so skip it.
# Keep this list in step with the `ignore` list in .codecov.yml.
paths-ignore:
  - tests # the top-level integration tests directory
  - src/**/tests.rs
  - src/**/fake.rs
  - src/testutil.rs
