name: crook CodeQL config

# Test code lives in predictable files (CONTRIBUTING.md): integration tests
# under tests/, unit tests in src/**/tests.rs, and two test-only helpers.
# Assertion messages there print session ids, which CodeQL's
# rust/cleartext-logging reads as secrets, so skip test code entirely.
paths-ignore:
  - tests
  - src/**/tests.rs
  - src/launch/fixture.rs
  - src/launch/child/fake.rs
