name: Build Binary

on:
  workflow_call:
    inputs:
      release-version:
        required: true
        type: string
        description: 'Version named in the archive (e.g. 1.0.0). It does not change the binary: that carries the Cargo.toml version.'
      cache-seed:
        required: true
        type: string
        description: 'Seed mixed into every cache key. Bump in the caller workflow to invalidate.'
      mise-version:
        required: true
        type: string
        description: 'Version of mise to install. Pass the caller workflow''s MISE_VERSION env var.'
      release-patch-name:
        required: false
        type: string
        default: ''
        description: 'Release patch artifact (the version bump and changelog commit) to apply before building. Empty builds the checked-out commit as it is.'
      targets:
        required: true
        type: string
        description: 'JSON-encoded array of {triple, runner} objects describing which tar.gz archives to build. Each caller writes it inline.'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target.triple }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # Every triple builds natively: musl Linux on architecture-matched
        # ubuntu runners, plus macOS. No docker, no `cross`.
        target: ${{ fromJson(inputs.targets) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Git
        if: ${{ inputs.release-patch-name != '' }}
        uses: ./.github/actions/configure-git

      - name: Apply Release Patch
        if: ${{ inputs.release-patch-name != '' }}
        uses: ./.github/actions/apply-release-patch
        with:
          release-patch-name: ${{ inputs.release-patch-name }}

      - name: Set up mise (installs Rust toolchain pinned in mise.toml)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ inputs.mise-version }}
          cache: true
          cache_key_prefix: ${{ inputs.cache-seed }}|mise|${{ inputs.mise-version }}|build-binary|${{ runner.os }}|${{ runner.arch }}|${{ matrix.target.triple }}

      - name: Add Rust target
        env:
          TRIPLE: ${{ matrix.target.triple }}
        run: rustup target add "$TRIPLE"

      # musl-tools provides musl-gcc, which rust needs as the linker
      # when targeting *-linux-musl. Architecture-native: x86_64-musl
      # runs on ubuntu-latest (x86_64); aarch64-musl on ubuntu-24.04-arm
      # (aarch64). apt-get installs the matching musl-gcc on each.
      - name: Install musl-tools
        if: contains(matrix.target.triple, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build binary
        env:
          TRIPLE: ${{ matrix.target.triple }}
        run: |
          set -euo pipefail
          # rusqlite compiles bundled SQLite with the C compiler cc-rs picks for the
          # target; on a glibc runner that must be musl-gcc, not the host `cc`.
          case "$TRIPLE" in
            *-linux-musl) export "CC_${TRIPLE//-/_}=musl-gcc" ;;
          esac
          cargo build --release --locked --target "$TRIPLE"

      - name: Stage archive contents
        env:
          TRIPLE: ${{ matrix.target.triple }}
          VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          stage="stage/crook-${VERSION}-${TRIPLE}"
          mkdir -p "${stage}"
          cp "target/${TRIPLE}/release/crook" "${stage}/"
          cp LICENSE "${stage}/LICENSE"
          cp README.md "${stage}/README.md"
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "${stage}/CHANGELOG.md"
          fi

      - name: Create archive (tar.gz)
        env:
          TRIPLE: ${{ matrix.target.triple }}
          VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          base="crook-${VERSION}-${TRIPLE}"
          mkdir -p dist
          tar -czvf "dist/${base}.tar.gz" -C stage "${base}"
          # macOS runners don't ship GNU coreutils: no `sha256sum`. The
          # BSD `shasum -a 256` produces identical "<hex>  <file>" output.
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "${base}.tar.gz" > "${base}.tar.gz.sha256" )
          fi

      # SLSA build provenance, attested for every archive that ships to
      # users: `gh attestation verify` can prove the archive was produced by
      # this workflow against this exact commit.
      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crook-*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crook-archive-${{ matrix.target.triple }}
          path: |
            dist/crook-*.tar.gz
            dist/crook-*.tar.gz.sha256
          if-no-files-found: error
