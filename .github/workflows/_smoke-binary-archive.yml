name: Smoke Binary

# Runs the archives that ship, not the test build: the tests use an
# instrumented debug binary, so nothing else executes the release build.
on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
        description: 'The same JSON {triple, runner} array the build took, from `toolr ci targets`.'
      expected-version:
        required: false
        type: string
        default: ''
        description: 'Version `crook --version` must print. Empty only checks it prints a version.'

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.target.triple }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Download the binary archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crook-archive-${{ matrix.target.triple }}
          path: ${{ runner.temp }}/archive

      - name: Run the shipped binary
        env:
          TRIPLE: ${{ matrix.target.triple }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/archive"
          # A glob, not the name, as the archive's version differs between CI and release.
          archive="$(ls crook-*-"${TRIPLE}".tar.gz)"
          shasum -a 256 -c "${archive}.sha256"
          tar -xzf "$archive"
          bin="$PWD/${archive%.tar.gz}/crook"
          home="$(mktemp -d)"
          # No inherited env, and crook's state and data homes in a throwaway dir.
          run() {
            env -i PATH=/usr/bin:/bin HOME="$home" \
              XDG_STATE_HOME="$home/state" XDG_DATA_HOME="$home/data" \
              "$bin" "$@"
          }
          if [ -n "$EXPECTED_VERSION" ]; then
            run --version | grep -Fx "crook ${EXPECTED_VERSION}"
          else
            run --version | grep -E '^crook [0-9]+\.[0-9]+\.[0-9]+'
          fi
          run --help >/dev/null
          for shell in bash zsh fish; do
            run completion print "$shell" | grep crook >/dev/null
          done
          # Empty input is bad input, which the hook answers with "ask", not a crash.
          run hook PreToolUse </dev/null | grep -F '"permissionDecision":"ask"'
