name: Smoke Binary

# Runs the archives that ship, not the test build: the tests use an
# instrumented debug binary, so nothing else executes the release build.
on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
        description: 'The same JSON {triple, runner} array the build took, from `toolr ci targets`.'
      expected-version:
        required: false
        type: string
        default: ''
        description: 'Version `crook --version` must print. Empty only checks it prints a version.'

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.target.triple }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The smoke script is in the repository; the binary comes from the archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binary archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crook-archive-${{ matrix.target.triple }}
          path: ${{ runner.temp }}/archive

      - name: Run the shipped binary
        env:
          TRIPLE: ${{ matrix.target.triple }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          set -euo pipefail
          # A glob, not the name, as the archive's version differs between CI and release.
          archive="$(ls "$RUNNER_TEMP"/archive/crook-*-"${TRIPLE}".tar.gz)"
          scripts/smoke-archive.sh "$archive" "$EXPECTED_VERSION"
