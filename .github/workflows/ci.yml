name: CI Workflow
run-name: "CI (${{ github.event_name == 'pull_request' && format('pr: #{0}', github.event.number) || format('branch: {0}', github.ref_name) }})"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a PR cancels that PR's older runs. Runs on main never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.repository }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ !contains(github.ref, 'refs/heads/main') }}

permissions: {}

env:
  COLUMNS: 190
  FORCE_COLOR: "1"
  # Bump to invalidate every cache (mise install dirs, prek hooks, ...) used by this workflow.
  CACHE_SEED: "1"
  # `MISE_VERSION` and `TOOLR_VERSION` live in `.github/env`: each job loads
  # that file in a "Load shared env vars" step right after `actions/checkout`.

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Setup Prek
        id: setup-pre-commit
        uses: ./.github/actions/setup-pre-commit
        with:
          cache-seed: ${{ env.CACHE_SEED }}|ci
          mise-version: ${{ env.MISE_VERSION }}

      - name: Setup ToolR
        # The prek hooks backed by `toolr pre-commit <command>` dispatch from the tools venv.
        id: setup-toolr
        uses: ./.github/actions/setup-toolr
        with:
          cache-prefix: ${{ env.CACHE_SEED }}|setup-toolr|pre-commit

      - name: Run Prek
        env:
          # The `pin-github-actions` hook resolves each pinned action's tag via `gh api`;
          # a token raises the rate limit from 60/hr (unauthenticated) to 5000/hr.
          GH_TOKEN: ${{ github.token }}
          # `herdr-app check` needs the desktop app, which CI does not have (Q34): the hook skips
          # itself when `herdr-app` is missing, and this says so in the log. `mod-check` below runs
          # the checks that need no app.
          SKIP: mod-herdr-check
        run: |
          prek run --all-files --show-diff-on-failure

  plugin-check:
    name: Plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The compatibility check reads the plugin at the newest `v*` tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Load shared env vars
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Setup ToolR
        id: setup-toolr
        uses: ./.github/actions/setup-toolr
        with:
          cache-prefix: ${{ env.CACHE_SEED }}|setup-toolr|plugin-check

      # Shape, hooks, skill names and templates; with a tag, also the names the last release used.
      - name: Check the plugin files
        run: toolr ci plugin-check --since-last-release

      # The Claude Code CLI needs Node 22 or newer. Installed from the committed lock file; its
      # native binary arrives by the package's postinstall, which `allowScripts` in
      # .github/claude-code/package.json allows and `--strict-allow-scripts` insists on.
      # `claude plugin validate` needs no login (checked with an empty HOME).
      # Node comes from mise.toml, so CI runs the same version as a local `mise install`.
      - name: Set up Node
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|node|plugin-check|${{ runner.os }}|${{ runner.arch }}

      - name: Install the Claude Code CLI
        run: npm ci --no-audit --no-fund --strict-allow-scripts --prefix .github/claude-code

      - name: Validate the plugin with Claude Code
        run: .github/claude-code/node_modules/.bin/claude plugin validate --strict plugin/

  mod-check:
    name: Mod checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Setup ToolR
        id: setup-toolr
        uses: ./.github/actions/setup-toolr
        with:
          cache-prefix: ${{ env.CACHE_SEED }}|setup-toolr|mod-check

      # Node comes from mise.toml, so CI runs the same version as a local `mise install`.
      - name: Set up Node
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|node|mod-check|${{ runner.os }}|${{ runner.arch }}

      # Syntax of each script, the `mod.json` shape and the crook shim. herdr-app is not installed here.
      - name: Check the mod files
        run: toolr ci mod-check

      # Coverage covers lib.js only: main.js imports `herdr`, which only the app provides, so no test loads it.
      # The status schema tests inside it skip until `schema/status.schema.json` exists.
      # Node 24 reads a bare folder argument as a file; a glob works on every version.
      - name: Run the mod tests with coverage
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-coverage-include='mod/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/mod.lcov \
            'tests/mod/*.test.mjs'

      - name: Upload mod coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          # A rejected upload must fail the job, as test-results uploads do.
          fail_ci_if_error: true
          # Same CLI as codecov-notify, not whatever `latest` is today.
          version: v11.3.2
          files: coverage/mod.lcov
          disable_search: true
          flags: mod

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|test|${{ runner.os }}|${{ runner.arch }}

      # rustup is outside mise's cached folders, so the component may be missing on any run.
      - name: Add the llvm-tools component
        run: rustup component add llvm-tools-preview

      - id: rust-version-checksum
        run: echo "version-sha256sum=$(rustc --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache `~/.cargo`
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CACHE_SEED }}|${{ runner.os }}|cargo|${{ steps.rust-version-checksum.outputs.version-sha256sum }}|${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      # `--no-report` accumulates profiles; `report` merges them. The `ci` profile
      # (.config/nextest.toml) also writes the JUnit file staged below. The schema checks
      # (tests/schema.rs, once it exists) are ordinary tests, so this step runs them on both OSes.
      - name: Run Rust tests with coverage
        run: |
          # `report` is not relied on to create the output directory.
          mkdir -p target/coverage
          cargo llvm-cov nextest --no-report --profile ci
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Use OpenID Connect for secure authentication (no token needed)
          use_oidc: true
          # A rejected upload must fail the job, as test-results uploads do.
          fail_ci_if_error: true
          # Same CLI as codecov-notify, not whatever `latest` is today.
          version: v11.3.2
          # Without an explicit file the CLI's search also uploads `.d` files, cargo
          # fingerprints and any source file with "coverage" in its name.
          files: target/coverage/cobertura.xml
          disable_search: true
          flags: linux

      - name: Stage test results for Codecov
        if: ${{ !cancelled() }}
        # Uploaded by the `codecov-notify` job: a test-results upload makes Codecov post
        # checks and the PR comment at once, ignoring `codecov.notify.manual_trigger`.
        uses: ./.github/actions/codecov-stage-test-results
        with:
          files: target/nextest/ci/junit.xml
          flags: linux
          name: Test / Test (Linux)
          artifact-name: linux

      # The `#[ignore]`d release-only tests build and run the release profile,
      # so they run outside coverage instrumentation.
      - name: Run the release-only tests
        # `--no-tests=pass`: nextest exits non-zero when nothing matches, and no test is `#[ignore]`d yet.
        run: cargo nextest run --release --run-ignored only --no-tests=pass

  test-macos:
    name: Test (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|test|${{ runner.os }}|${{ runner.arch }}

      # rustup is outside mise's cached folders, so the component may be missing on any run.
      - name: Add the llvm-tools component
        run: rustup component add llvm-tools-preview

      - id: rust-version-checksum
        run: echo "version-sha256sum=$(rustc --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache `~/.cargo`
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CACHE_SEED }}|${{ runner.os }}|cargo|${{ steps.rust-version-checksum.outputs.version-sha256sum }}|${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      # `--no-report` accumulates profiles; `report` merges them. The `ci` profile
      # (.config/nextest.toml) also writes the JUnit file staged below. The schema checks
      # (tests/schema.rs, once it exists) are ordinary tests, so this step runs them on both OSes.
      - name: Run Rust tests with coverage
        run: |
          # `report` is not relied on to create the output directory.
          mkdir -p target/coverage
          cargo llvm-cov nextest --no-report --profile ci
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Use OpenID Connect for secure authentication (no token needed)
          use_oidc: true
          # A rejected upload must fail the job, as test-results uploads do.
          fail_ci_if_error: true
          # Same CLI as codecov-notify, not whatever `latest` is today.
          version: v11.3.2
          # Without an explicit file the CLI's search also uploads `.d` files, cargo
          # fingerprints and any source file with "coverage" in its name.
          files: target/coverage/cobertura.xml
          disable_search: true
          flags: macos

      - name: Stage test results for Codecov
        if: ${{ !cancelled() }}
        # Uploaded by the `codecov-notify` job: a test-results upload makes Codecov post
        # checks and the PR comment at once, ignoring `codecov.notify.manual_trigger`.
        uses: ./.github/actions/codecov-stage-test-results
        with:
          files: target/nextest/ci/junit.xml
          flags: macos
          name: Test / Test (macOS)
          artifact-name: macos

      # The `#[ignore]`d release-only tests build and run the release profile,
      # so they run outside coverage instrumentation.
      - name: Run the release-only tests
        # `--no-tests=pass`: nextest exits non-zero when nothing matches, and no test is `#[ignore]`d yet.
        run: cargo nextest run --release --run-ignored only --no-tests=pass

  test-tools:
    name: Test (tools)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Setup ToolR
        id: setup-toolr
        uses: ./.github/actions/setup-toolr
        with:
          cache-prefix: ${{ env.CACHE_SEED }}|setup-toolr|test-tools

      # The mod-check tests run `node --check`.
      # Node comes from mise.toml, so CI runs the same version as a local `mise install`.
      - name: Set up Node
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|node|test-tools|${{ runner.os }}|${{ runner.arch }}

      # `--no-sync`: the action already synced the venv, so a missing or stale one fails fast.
      - name: Run the tools tests with coverage
        run: toolr project venv run --no-sync -- coverage run -m pytest tests/tools

      - name: Write the tools coverage report
        run: toolr project venv run --no-sync -- coverage xml -o coverage/tools.xml

      - name: Upload tools coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          # A rejected upload must fail the job, as test-results uploads do.
          fail_ci_if_error: true
          # Same CLI as codecov-notify, not whatever `latest` is today.
          version: v11.3.2
          files: coverage/tools.xml
          disable_search: true
          flags: tools

  codecov-notify:
    name: Codecov Notify
    # `.codecov.yml` sets `manual_trigger`, but a test-results upload notifies
    # anyway, so those are uploaded here too, after every coverage upload.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - mod-check
      - test-linux
      - test-macos
      - test-tools
    permissions:
      contents: read
      id-token: write
    env:
      # Loads `mise.ci.toml`, and `mise.ci.lock` for the `--locked` install.
      MISE_ENV: ci
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Install the Codecov CLI
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: github:codecov/codecov-cli
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|codecov-notify|${{ runner.os }}|${{ runner.arch }}

      - name: Upload test results and tell Codecov every upload is in
        uses: ./.github/actions/codecov-publish-test-results

  set-pipeline-exit-status:
    permissions: {}
    # This job exists so the branch ruleset can require a single check that
    # represents the whole workflow. It must list EVERY job in `needs`: a job
    # skipped because an upstream dependency failed reports `skipped`, not
    # `failure`, so a failure is only visible here on the job that directly
    # failed. `toolr pre-commit check-gate-needs` keeps the list complete.
    name: ${{ format('Set the {0}({1}) Pipeline Exit Status', github.workflow, github.event_name) }}
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - codecov-notify
      - mod-check
      - plugin-check
      - pre-commit
      - test-linux
      - test-macos
      - test-tools
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # A local `uses:` resolves from the checked-out tree, and gate jobs
      # otherwise never check out the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate on the needed jobs' results
        uses: ./.github/actions/pipeline-gate
        with:
          jobs: ${{ toJSON(needs) }}
