name: CI Workflow
run-name: "CI (${{ github.event_name == 'pull_request' && format('pr: #{0}', github.event.number) || format('branch: {0}', github.ref_name) }})"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a PR cancels that PR's older runs. Runs on main never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.repository }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ !contains(github.ref, 'refs/heads/main') }}

permissions: {}

env:
  COLUMNS: 190
  FORCE_COLOR: "1"
  # Bump to invalidate every cache (mise install dirs, prek hooks, ...) used by this workflow.
  CACHE_SEED: "1"
  # `MISE_VERSION` and `TOOLR_VERSION` live in `.github/env`: each job loads
  # that file in a "Load shared env vars" step right after `actions/checkout`.

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Setup Prek
        id: setup-pre-commit
        uses: ./.github/actions/setup-pre-commit
        with:
          cache-seed: ${{ env.CACHE_SEED }}|ci
          mise-version: ${{ env.MISE_VERSION }}

      - name: Setup ToolR
        # The prek hooks backed by `toolr pre-commit <command>` dispatch from the tools venv.
        id: setup-toolr
        uses: ./.github/actions/setup-toolr
        with:
          cache-prefix: ${{ env.CACHE_SEED }}|setup-toolr|pre-commit

      - name: Run Prek
        env:
          # The `pin-github-actions` hook resolves each pinned action's tag via `gh api`;
          # a token raises the rate limit from 60/hr (unauthenticated) to 5000/hr.
          GH_TOKEN: ${{ github.token }}
          # `npm run typecheck` needs Claude Code's own declaration file, which cannot be
          # vendored (licence) and does not exist on a runner. See CONTRIBUTING.md.
          SKIP: tsc
        run: |
          prek run --all-files --show-diff-on-failure

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|test|${{ runner.os }}|${{ runner.arch }}

      # The shared `~/.rustup` cache may have been saved by a job that never added this component.
      - name: Add the llvm-tools component
        run: rustup component add llvm-tools-preview

      - id: rust-version-checksum
        run: echo "version-sha256sum=$(rustc --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache `~/.cargo`
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CACHE_SEED }}|${{ runner.os }}|cargo|${{ steps.rust-version-checksum.outputs.version-sha256sum }}|${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      # `--no-report` accumulates profiles; `report` merges them. The `ci` profile
      # (.config/nextest.toml) also writes the JUnit file staged below.
      - name: Run Rust tests with coverage
        run: |
          # `report` is not relied on to create the output directory.
          mkdir -p target/coverage
          cargo llvm-cov nextest --no-report --profile ci
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Use OpenID Connect for secure authentication (no token needed)
          use_oidc: true
          # Without an explicit file the CLI's search also uploads `.d` files, cargo
          # fingerprints and any source file with "coverage" in its name.
          files: target/coverage/cobertura.xml
          disable_search: true
          flags: linux

      - name: Stage test results for Codecov
        if: ${{ !cancelled() }}
        # Uploaded by the `codecov-notify` job: a test-results upload makes Codecov post
        # checks and the PR comment at once, ignoring `codecov.notify.manual_trigger`.
        uses: ./.github/actions/codecov-stage-test-results
        with:
          files: target/nextest/ci/junit.xml
          flags: linux
          name: Test / Test (Linux)
          artifact-name: linux

      # The `#[ignore]`d release-only tests build and run the release profile,
      # so they run outside coverage instrumentation.
      - name: Run the release-only tests
        run: cargo nextest run --release --run-ignored only

  test-macos:
    name: Test (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|test|${{ runner.os }}|${{ runner.arch }}

      # The shared `~/.rustup` cache may have been saved by a job that never added this component.
      - name: Add the llvm-tools component
        run: rustup component add llvm-tools-preview

      - id: rust-version-checksum
        run: echo "version-sha256sum=$(rustc --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache `~/.cargo`
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CACHE_SEED }}|${{ runner.os }}|cargo|${{ steps.rust-version-checksum.outputs.version-sha256sum }}|${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      # `--no-report` accumulates profiles; `report` merges them. The `ci` profile
      # (.config/nextest.toml) also writes the JUnit file staged below.
      - name: Run Rust tests with coverage
        run: |
          # `report` is not relied on to create the output directory.
          mkdir -p target/coverage
          cargo llvm-cov nextest --no-report --profile ci
          cargo llvm-cov report --cobertura --output-path target/coverage/cobertura.xml

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Use OpenID Connect for secure authentication (no token needed)
          use_oidc: true
          # Without an explicit file the CLI's search also uploads `.d` files, cargo
          # fingerprints and any source file with "coverage" in its name.
          files: target/coverage/cobertura.xml
          disable_search: true
          flags: macos

      - name: Stage test results for Codecov
        if: ${{ !cancelled() }}
        # Uploaded by the `codecov-notify` job: a test-results upload makes Codecov post
        # checks and the PR comment at once, ignoring `codecov.notify.manual_trigger`.
        uses: ./.github/actions/codecov-stage-test-results
        with:
          files: target/nextest/ci/junit.xml
          flags: macos
          name: Test / Test (macOS)
          artifact-name: macos

      # The `#[ignore]`d release-only tests build and run the release profile,
      # so they run outside coverage instrumentation.
      - name: Run the release-only tests
        run: cargo nextest run --release --run-ignored only

  test-mod:
    name: Test (mod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|test-mod|${{ runner.os }}|${{ runner.arch }}

      - name: Install the mod's dependencies
        run: npm ci

      - name: Run the mod's tests with coverage
        run: npm run coverage

      - name: Upload mod coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/cobertura-coverage.xml
          disable_search: true
          flags: mod

  test-tools:
    name: Test (tools)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Setup ToolR
        id: setup-toolr
        uses: ./.github/actions/setup-toolr
        with:
          cache-prefix: ${{ env.CACHE_SEED }}|setup-toolr|test-tools

      # `--no-sync`: the action already synced the venv, so a missing or stale one fails fast.
      - name: Run the tools tests with coverage
        run: toolr project venv run --no-sync -- coverage run -m pytest tests/tools

      - name: Write the tools coverage report
        run: toolr project venv run --no-sync -- coverage xml -o coverage/tools.xml

      - name: Upload tools coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/tools.xml
          disable_search: true
          flags: tools

  codecov-notify:
    name: Codecov Notify
    # `.codecov.yml` sets `manual_trigger`, but a test-results upload notifies
    # anyway, so those are uploaded here too, after every coverage upload.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test-linux
      - test-macos
      - test-mod
      - test-tools
    permissions:
      contents: read
      id-token: write
    env:
      # Loads `mise.ci.toml`, and `mise.ci.lock` for the `--locked` install.
      MISE_ENV: ci
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Install the Codecov CLI
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: github:codecov/codecov-cli
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|codecov-notify|${{ runner.os }}|${{ runner.arch }}

      - name: Upload test results and tell Codecov every upload is in
        uses: ./.github/actions/codecov-publish-test-results

  prepare-ci:
    name: Prepare CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      # Mirror env.CACHE_SEED / env.MISE_VERSION: a workflow-call `with:` block
      # can't read `env`, so the build job reads these outputs instead.
      cache-seed: ${{ steps.expose.outputs.cache-seed }}
      mise-version: ${{ steps.expose.outputs.mise-version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Setup ToolR
        id: setup-toolr
        uses: ./.github/actions/setup-toolr
        with:
          cache-prefix: ${{ env.CACHE_SEED }}|setup-toolr|prepare-ci

      - name: Expose the cache seed and mise version
        id: expose
        run: |
          {
            echo "cache-seed=${CACHE_SEED}"
            echo "mise-version=${MISE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: List the CI targets
        id: targets
        run: toolr ci targets

  build-binary-archive:
    name: Build (binary)
    # The release-shaped build, for the targets `toolr ci targets` marks for CI.
    needs:
      - prepare-ci
    uses: ./.github/workflows/_build-binary-archive.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      release-version: 0.0.0-ci
      cache-seed: ${{ needs.prepare-ci.outputs.cache-seed }}
      mise-version: ${{ needs.prepare-ci.outputs.mise-version }}
      targets: ${{ needs.prepare-ci.outputs.targets }}

  packslip-check:
    name: Packslip Check
    needs:
      - build-binary-archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        # `$GITHUB_ENV` expects strict `KEY=VALUE` lines and rejects blank/comment
        # lines as "Invalid format", so keep only the assignments.
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      - name: Download binary archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crook-archive-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache: true
          cache_key_prefix: ${{ env.CACHE_SEED }}|mise|${{ env.MISE_VERSION }}|packslip-check|${{ runner.os }}|${{ runner.arch }}

      - name: Setup ToolR
        id: setup-toolr
        uses: ./.github/actions/setup-toolr
        with:
          cache-prefix: ${{ env.CACHE_SEED }}|setup-toolr|packslip-check

      - name: Install the packslip CLI
        id: packslip
        env:
          # Renovate bumps this and any packslip pin in a release workflow in one PR.
          PACKSLIP_VERSION: 1.11.4
          GH_TOKEN: ${{ github.token }}
        # mise verifies GitHub artifact attestations only when it finds some:
        # none found (or an API error) falls through to an unverified install,
        # and it pins no signer workflow. So verify the release asset
        # fail-closed, then require mise's (possibly cache-restored) binary to
        # be byte-identical to the verified one. Since 1.6.0 packslip builds
        # and attests on its `release-plz` branch and the tag only promotes
        # those bytes, so the ref pin is the branch, not the tag.
        run: |
          set -euo pipefail
          name="packslip-v${PACKSLIP_VERSION}-linux-x64"
          dir="$RUNNER_TEMP/packslip-release"
          gh release download "v${PACKSLIP_VERSION}" --repo jdx/packslip \
            --pattern "$name.tar.xz" --dir "$dir"
          gh attestation verify "$dir/$name.tar.xz" --repo jdx/packslip \
            --signer-workflow jdx/packslip/.github/workflows/release.yml \
            --source-ref refs/heads/release-plz \
            --deny-self-hosted-runners
          tar -xJf "$dir/$name.tar.xz" -C "$dir"
          mise install "github:jdx/packslip@${PACKSLIP_VERSION}"
          packslip="$(mise which -t "github:jdx/packslip@${PACKSLIP_VERSION}" packslip)"
          cmp "$dir/$name/packslip" "$packslip"
          echo "path=$packslip" >> "$GITHUB_OUTPUT"

      - name: Check the release manifest against the built archives
        env:
          PACKSLIP: ${{ steps.packslip.outputs.path }}
        run: toolr ci packslip-check "$RUNNER_TEMP/archives" --packslip "$PACKSLIP"

  smoke-binary:
    name: Smoke (${{ matrix.target.triple }})
    # Runs the archive that ships, not the test build: the tests use an
    # instrumented debug binary, so nothing else executes the release build.
    needs:
      - build-binary-archive
      - prepare-ci
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare-ci.outputs.targets) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Download the binary archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crook-archive-${{ matrix.target.triple }}
          path: ${{ runner.temp }}/archive

      - name: Run the shipped binary
        env:
          TRIPLE: ${{ matrix.target.triple }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/archive"
          # A glob, not the name, so a change to `release-version` above can't break this.
          archive="$(ls crook-*-"${TRIPLE}".tar.gz)"
          shasum -a 256 -c "${archive}.sha256"
          tar -xzf "$archive"
          bin="$PWD/${archive%.tar.gz}/crook"
          home="$(mktemp -d)"
          # No inherited env, and crook's state and data homes in a throwaway dir.
          run() { env -i PATH=/usr/bin:/bin HOME="$home" XDG_STATE_HOME="$home/state" XDG_DATA_HOME="$home/data" "$bin" "$@"; }
          run --version | grep -E '^crook [0-9]+\.[0-9]+\.[0-9]+'
          run --help >/dev/null
          for shell in bash zsh fish; do
            run completion print "$shell" | grep crook >/dev/null
          done
          # Empty input is bad input, which the hook answers with "ask", not a crash.
          run hook PreToolUse </dev/null | grep -F '"permissionDecision":"ask"'

  set-pipeline-exit-status:
    permissions: {}
    # This job exists so the branch ruleset can require a single check that
    # represents the whole workflow. It must list EVERY job in `needs`: a job
    # skipped because an upstream dependency failed reports `skipped`, not
    # `failure`, so a failure is only visible here on the job that directly
    # failed. `toolr pre-commit check-gate-needs` keeps the list complete.
    name: ${{ format('Set the {0}({1}) Pipeline Exit Status', github.workflow, github.event_name) }}
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build-binary-archive
      - codecov-notify
      - packslip-check
      - pre-commit
      - prepare-ci
      - smoke-binary
      - test-linux
      - test-macos
      - test-mod
      - test-tools
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # A local `uses:` resolves from the checked-out tree, and gate jobs
      # otherwise never check out the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate on the needed jobs' results
        uses: ./.github/actions/pipeline-gate
        with:
          jobs: ${{ toJSON(needs) }}
