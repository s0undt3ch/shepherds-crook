name: Install Smoke Tests

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        # release.yml's dispatch-install-smoke passes this; keep the name in sync.
        description: 'Version to smoke-test (defaults to the newest release with a packslip)'
        required: false
        type: string

# Dispatches of the same version supersede each other. The scheduled run and
# the one release.yml dispatches land in different groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.version || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Installs the published release the way a user does, through mise's
  # packslip backend, which verifies the Sigstore bundle.
  smoke-mise:
    name: mise packslip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared env vars
        run: sed -n '/^[A-Z]/p' .github/env >> "$GITHUB_ENV"

      # Not `@latest`: mise holds a fresh release back from `latest` for a
      # while, so a run right after a release would test the previous one.
      # The newest release with a packslip, not just the newest: release.yml
      # uploads the packslip a few minutes after creating the release.
      - name: Resolve the version to test
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            VERSION=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq \
              '[.[] | select(.draft | not) | select(any(.assets[]; .name == "packslip.sigstore.json"))][0].tag_name // ""')
          fi
          if [ -z "$VERSION" ]; then
            echo "::notice::No release with a packslip yet, so there is nothing to smoke-test"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set up mise
        if: steps.resolve.outputs.found == 'true'
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ env.MISE_VERSION }}
          # Only mise itself: the release is installed below, outside the repo's own pins.
          install: false
          cache: false

      - name: Install crook from the packslip
        if: steps.resolve.outputs.found == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          # Anonymous GitHub API calls hit the rate limit, and mise then
          # silently drops packslip resources.
          GITHUB_TOKEN: ${{ github.token }}
          # Some mise versions refuse even an exact version until it is a day old.
          MISE_MINIMUM_RELEASE_AGE: "0"
          MISE_YES: "1"
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          cd "$smoke"
          # Keeps mise from reading the repository's own mise.toml.
          export MISE_CEILING_PATHS="$RUNNER_TEMP"
          mise use "packslip:github.com/s0undt3ch/shepherds-crook@${VERSION}"
          mise bin-paths >> "$GITHUB_PATH"

      - name: Check crook --version
        if: steps.resolve.outputs.found == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          crook="$(command -v crook)"
          case "$crook" in
            "$RUNNER_TEMP"/*|*/mise/*) ;;
            *) echo "::error::crook resolved to $crook, not the mise install" >&2; exit 1 ;;
          esac
          out="$(crook --version)"
          echo "$out"
          if [ "$out" != "crook ${VERSION}" ]; then
            echo "::error::Expected 'crook ${VERSION}', got '${out}'" >&2
            exit 1
          fi

      - name: Check crook completion print zsh
        if: steps.resolve.outputs.found == 'true'
        run: |
          set -euo pipefail
          crook completion print zsh > "$RUNNER_TEMP/_crook"
          test -s "$RUNNER_TEMP/_crook"

  set-pipeline-exit-status:
    permissions: {}
    # `toolr pre-commit check-gate-needs` keeps `needs` complete.
    name: ${{ format('Set the {0}({1}) Pipeline Exit Status', github.workflow, github.event_name) }}
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - smoke-mise
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # A local `uses:` resolves from the checked-out tree, and gate jobs
      # otherwise never check out the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate on the needed jobs' results
        uses: ./.github/actions/pipeline-gate
        with:
          jobs: ${{ toJSON(needs) }}
