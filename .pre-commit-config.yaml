---
minimum_pre_commit_version: 3.0.0
# Install both the pre-commit and commit-msg git hooks on `prek install`.
# `default_stages` keeps `pass_filenames: false` hooks from running a second
# time at the commit-msg stage.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer

  - repo: https://github.com/s0undt3ch/pre-commit-hooks
    rev: v1.6.0
    hooks:
      # Pins unpinned `uses:` refs to a SHA and verifies existing pins.
      # Needs `gh`.
      - id: pin-github-actions
      - id: jactionlint-fix
      - id: shellcheck
      - id: gitleaks
      - id: typos

      # git-cliff builds the changelog from commit subjects, so spell-check
      # the message too. Check-only: the message is never rewritten.
      - id: system-tool
        alias: typos-commit-msg
        name: typos (commit message)
        args: [typos]
        stages: [commit-msg]

      - id: rumdl

  - repo: local
    hooks:
      # Hooks backed by toolr commands in tools/. They need the `toolr` binary
      # (pinned in mise.toml; Setup ToolR provides it in CI).
      - id: check-gate-needs
        name: Keep pipeline gate jobs needing every other job
        # Auto-fix style: the command rewrites each gate's wiring in place; prek sees the
        # modified workflow and fails the commit until the fresh file is staged.
        entry: toolr pre-commit check-gate-needs
        language: system
        pass_filenames: false
        files: >
          (?x)^(
            \.github/workflows/.*\.yml$|
            tools/precommit/(workflows|_common)\.py$
          )$

      - id: private-words
        name: Keep private words out of the tracked tree
        entry: toolr pre-commit private-words
        language: system
        pass_filenames: false
        always_run: true
