# rumdl: markdown lint config. https://github.com/rvben/rumdl

[global]
disable = [
    "MD033",  # inline HTML
    "MD041",  # first-line H1
]

exclude = [
    ".git",
    "node_modules",
]

respect-gitignore = true
flavor = "gfm"

[MD013]
line_length = 120
code_blocks = false
tables = false
headings = false

[MD024]
siblings_only = true

[MD029]
style = "ordered"

[MD025]
# ADRs carry `title` in their frontmatter and repeat it as the H1.
front-matter-title = ""
