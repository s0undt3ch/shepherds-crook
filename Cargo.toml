[package]
name = "crook"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Orchestrates Claude Code sessions across projects"
license = "Apache-2.0"
repository = "https://github.com/s0undt3ch/shepherds-crook"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"

[profile.release]
panic = "unwind"
lto = "thin"
strip = true
