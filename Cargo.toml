[package]
name = "crook"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Orchestrates Claude Code sessions across projects"
license = "Apache-2.0"
repository = "https://github.com/s0undt3ch/shepherds-crook"

[dependencies]
bitflags = "2.13.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
include_dir = "0.7.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[profile.release]
panic = "unwind"
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
