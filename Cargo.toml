[package]
name = "crook"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Orchestrates Claude Code sessions across projects"
license = "Apache-2.0"
repository = "https://github.com/s0undt3ch/shepherds-crook"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.32.0", default-features = false, features = ["signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1"

# The hook catches panics with `catch_unwind`, which does nothing under `panic = "abort"`.
[profile.release]
panic = "unwind"
lto = "thin"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
# Pinned exactly: validates the committed JSON Schemas (Q5); the 0.x line changes its API between minors.
jsonschema = { version = "=0.63.2", default-features = false }
tempfile = "3"
