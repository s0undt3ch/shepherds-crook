# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/docs/#introduction
header = """
# Changelog

All notable changes to this project will be documented in this file.

This project uses [*git-cliff*](https://git-cliff.org/) to automatically generate changelog entries
from [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/), and this project adheres
to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{%- macro remote_url() -%}
  https://github.com/s0undt3ch/shepherds-crook
{%- endmacro -%}

{%- if version %}\
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}\
    ## Unreleased
{%- endif %}\

{%- for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}

    ### {{ group | upper_first }}
    {% for commit in commits | unique(attribute="message") %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} \
            ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }}))\
    {% endfor %}
{%- endfor %}\n
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/docs/#introduction
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true


[git]
# Only final releases are changelog sections. Pre-release tags (`v0.1.0-rc.1`) and the floating
# `vX`/`vX.Y` tags don't match, so a final release rolls up its pre-releases. Until a final tag exists,
# `toolr release changelog-range` names the commit range to read (it starts after v1's last commit,
# 714568f); once one exists, `--unreleased` reads from it.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
  # Commits carrying a `Changelog: skip` trailer in their body are
  # omitted from release notes. Use for purely-internal cleanups
  # (formatting drift, test-fixture renames, etc.) that don't move
  # the project forward in a user-visible way and would add noise
  # to the changelog. Apply sparingly.
  { body = "Changelog: skip", skip = true },
  { message = "^feat", group = "<!-- 00 -->🚀 Features" },
  { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 03 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 04 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 02 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 05 -->🎨 Styling" },
  { message = "^test", group = "<!-- 06 -->🧪 Testing" },
  { message = "(?i)^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 07 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 08 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 09 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"

[bump]
# The first release's version when no final tag exists yet; it must match `tag_pattern` above.
initial_tag = "v0.1.0"
