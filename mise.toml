# mise.lock is lockfile format 4, which older mise refuses to read.
min_version = "2026.11.1"

[tools]
# CI runners default to the `minimal` rustup profile, which ships no clippy, so name the
# components. Keep `rust-version` in Cargo.toml equal to this pin.
rust = { version = "1.99.1", profile = "minimal", components = "clippy,rustfmt" }
"cargo:cargo-nextest" = "0.9.152"
# `toolr release bump` runs `cargo set-version`, which updates Cargo.toml and Cargo.lock together.
"cargo:cargo-edit" = "0.13.14"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
prek = "0.5.11"
uv = "0.13.9"
git-cliff = "2.14.2"
typos = "1.52.2"
rumdl = "v0.3.5"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
jactionlint = "v2.6.0"
gh = "2.105.0"
"aqua:s0undt3ch/ToolR" = "0.37.0"
"github:joshrotenberg/adrs" = "0.13.0"

[settings]
# `mise install` writes and refreshes `mise.lock`; commit it.
lockfile = true
