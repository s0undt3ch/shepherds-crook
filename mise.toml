# mise.lock is lockfile format 4, which older mise refuses to read.
min_version = "2026.11.1"

[tools]
prek = "0.5.11"
uv = "0.13.9"
typos = "1.52.2"
rumdl = "v0.3.5"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
jactionlint = "v2.6.0"
gh = "2.105.0"
"aqua:s0undt3ch/ToolR" = "0.37.0"

[settings]
# `mise install` writes and refreshes `mise.lock`; commit it.
lockfile = true
