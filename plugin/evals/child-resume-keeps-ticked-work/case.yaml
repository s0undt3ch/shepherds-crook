schema_version: "1.1"
name: child-resume-keeps-ticked-work
description: 'A resumed child with step 1 ticked and on disk with its log already holding step1: it appends step2 and does not append step1 again.'
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are a child session of a crook flock. A coordinator gave you one brief.
    Before anything else, invoke the `crook-child` skill and follow it.

    You were restarted. Check what is already done on disk, then finish without redoing completed work. Your brief is briefs/steps.md. Your result file is results/steps.md.

    (The folder you run in is the flock's folder; the two paths are relative to it.)
graders:
  - name: status-done
    type: 'regex'
    pattern: '^---\nstatus: done\n---\n'
    target: { source: 'file', path: 'results/steps.md' }
  - name: step2-ticked
    type: 'regex'
    pattern: '- \[[xX]\] [^\n]*[Ss]tep 2'
    target: { source: 'file', path: 'results/steps.md' }
  - name: step1-still-ticked
    type: 'regex'
    pattern: '- \[[xX]\] [^\n]*[Ss]tep 1'
    target: { source: 'file', path: 'results/steps.md' }
  - name: no-open-items
    type: 'regex'
    pattern: '- \[ \]'
    match: 'not_contains'
    target: { source: 'file', path: 'results/steps.md' }
  - name: log-no-duplicate-step
    type: 'regex'
    pattern: '^step1\nstep2\n?$'
    target: { source: 'file', path: 'out/log.txt' }
    weight: 20
  - name: skill-invoked
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?crook-child"'
    weight: 20
  - name: never-hc-send
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bhc\s+send'
    min: 0
    max: 0
    weight: 20
  - name: never-git-worktree
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'git\s+worktree'
    min: 0
    max: 0
    weight: 20
