schema_version: "1.1"
name: coord-writes-brief-and-spawns
description: 'Told to delegate one small mechanical job: a five-heading brief, then spawn on the cheapest model (haiku, per models.md) by the literal crook path.'
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the coordinator of the crook flock demo. Its folder is the current working directory and its notes folder is the same. Load the crook-coordinator skill and follow it.

    The maintainer's first task: Delegate this now, no further planning needed: have one child, named `survey`, write a three-line plain-text note on what a haiku is to `notes/haiku.txt`. It is a small mechanical job.
graders:
  - name: brief-headings
    type: 'regex'
    pattern: '## Goal[\s\S]*## Why[\s\S]*## Scope[\s\S]*## References[\s\S]*## Done when'
    target: { source: 'file', path: 'briefs/survey.md' }
  - name: spawn-call-with-model
    type: 'regex'
    pattern: '^spawn child survey \S*briefs/survey\.md\b.*--model haiku\b'
    flags: 'm'
    target: { source: 'file', path: '.crook-calls.log' }
    weight: 20
  - name: no-bare-crook
    type: 'tool_used'
    tool: 'Bash'
    input_match: '("command"\s*:\s*"|[;&|]|\\n)\s*crook\s'
    min: 0
    max: 0
    weight: 20
  - name: no-forbidden-hc
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'hc\s+(run|kill|rm)\b|--force'
    min: 0
    max: 0
    weight: 20
  - name: skill-invoked
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?crook-coordinator"'
    weight: 20
  - name: uses-literal-path
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command"\s*:\s*"\\"/[^"\\]+/shims/crook\\" '
    min: 1
    weight: 20
  - name: no-compound-crook
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?!\\"/)(?:[^"\\]|\\.)*shims/crook|shims/crook\\"(?:[^"\\]|\\.)*(\||&&|;)'
    min: 0
    max: 0
    weight: 20
  - name: no-shim-form
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'CROOK_BIN|MISE_DATA_DIR|\$HOME'
    min: 0
    max: 0
    weight: 20
